name: python

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        tool: [allgaeuer_zeitung_mcp, pdf_ingest, nextcloud_ods_mcp, obsidian_mcp, ratsinfo_mcp]
    concurrency:
      group: python-${{ matrix.tool }}-${{ github.ref }}
      cancel-in-progress: true

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: Install uv
        uses: astral-sh/setup-uv@v8.3.2
        with:
          enable-cache: true
          cache-dependency-glob: tools/${{ matrix.tool }}/uv.lock

      - name: Sync dependencies
        working-directory: tools/${{ matrix.tool }}
        run: uv sync

      - name: Ruff lint
        working-directory: tools/${{ matrix.tool }}
        run: uv run ruff check

      - name: Ruff format check
        working-directory: tools/${{ matrix.tool }}
        run: uv run ruff format --check

      - name: mypy
        working-directory: tools/${{ matrix.tool }}
        run: uv run mypy src/

      - name: pytest
        working-directory: tools/${{ matrix.tool }}
        # Exit code 5 = "no tests collected" (e.g. allgaeuer_zeitung_mcp has no tests yet)
        run: uv run pytest || [ $? -eq 5 ]

  # Lose Python-Skripte (skills/*/scripts) haben kein uv-Projekt: kein
  # pyproject, kein eigener Ruff-Pin. ruff läuft daher als ephemerales
  # uvx-Tool; die Config kommt aus ruff.toml am Repo-Root. ruff entdeckt
  # die Config pro Datei; alle Tools tragen eigene [tool.ruff]-Sektionen
  # in tools/*/pyproject.toml, deshalb bleibt deren Lint-Umfang
  # unberührt. Der Pin 0.15.21 entspricht der Untergrenze aus
  # pdf_ingest und nextcloud_ods_mcp. Renovate sieht Versionspins in
  # run:-Zeilen nicht — manuell mitpflegen (Issue #77).
  scripts-lint:
    name: Lose Python-Skripte (skills/*/scripts)
    runs-on: ubuntu-latest
    concurrency:
      group: python-scripts-lint-${{ github.ref }}
      cancel-in-progress: true

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@v8.3.2

      - name: Ruff lint
        run: uvx ruff@0.15.21 check skills/*/scripts

      - name: Ruff format check
        run: uvx ruff@0.15.21 format --check skills/*/scripts
