[project]
name = "obsidian-mcp"
version = "0.1.0"
description = "MCP server for direct read/write access to an Obsidian vault (markdown files)"
requires-python = ">=3.11"
dependencies = [
    "mcp[cli]>=1.2.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/obsidian_mcp"]

[dependency-groups]
dev = [
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "ruff>=0.8.0",
]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
# Bewusst nur die Ruff-Defaults: Ohne eigene Sektion griffe hier die
# Root-ruff.toml am Repo-Root (E,F,I,UP,B,SIM) und erweiterte den
# Lint-Umfang still. Angleich ans strenge Set von pdf_ingest und
# nextcloud_ods_mcp: Folgeticket zu Issue #77.
select = ["E4", "E7", "E9", "F"]
