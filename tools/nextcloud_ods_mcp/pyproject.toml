[project]
name = "nextcloud-ods-mcp"
version = "0.1.0"
description = "MCP server for reading ODS (OpenDocument Spreadsheet) files: list sheets, read ranges/cells, search"
requires-python = ">=3.14"
dependencies = [
    "mcp>=1.28.1",
    "odfpy>=1.4.1",
    "pydantic>=2.13.4",
]

[project.scripts]
nextcloud-ods-mcp = "nextcloud_ods_mcp.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/nextcloud_ods_mcp"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.15.21",
    "mypy>=2.3.0",
]

[tool.ruff]
line-length = 88
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.14"
strict = true
warn_unused_ignores = true
warn_redundant_casts = true

[[tool.mypy.overrides]]
module = ["odf.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
