[project]
name = "ratsinfo-mcp"
version = "0.1.0"
description = "MCP server wrapping the ratsinfo CLI (Ratsinformationssystem Buchloe)"
requires-python = ">=3.11"
dependencies = [
    "mcp[cli]>=1.2.0",
]

[project.scripts]
ratsinfo-mcp = "ratsinfo_mcp.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ratsinfo_mcp"]

[dependency-groups]
dev = [
    "ruff>=0.8.0",
    "mypy>=1.13.0",
    "pytest>=9.1.1",
]
