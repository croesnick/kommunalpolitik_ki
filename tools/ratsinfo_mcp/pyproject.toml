[project]
name = "ratsinfo-mcp"
version = "0.1.0"
description = "MCP server wrapping the ratsinfo CLI (Ratsinformationssystem Buchloe)"
requires-python = ">=3.14"
dependencies = [
    "mcp[cli]>=1.2.0",
]

[project.scripts]
ratsinfo-mcp = "ratsinfo_mcp.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ratsinfo_mcp"]

[dependency-groups]
dev = [
    "ruff>=0.15.21",
    "mypy>=1.13.0",
    "pytest>=9.1.1",
]

[tool.ruff]
line-length = 88
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.14"
