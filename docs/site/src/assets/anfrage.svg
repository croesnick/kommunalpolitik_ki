<svg viewBox="0 0 760 300" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="flow-title flow-desc">
  <title id="flow-title">Ablauf eines Tool-Aufrufs</title>
  <desc id="flow-desc">Gate 1 prüft die Anfrage als Ausgabe und schreibt einen Beleg ins Journal, dann ruft der Vermittler den Connector, und Gate 2 prüft und labelt die Antwort.</desc>
  <defs><marker id="ah2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="svg-arrowhead"/></marker></defs>
  <rect x="20" y="30" width="110" height="50" rx="8" class="svg-box"/>
  <text x="75" y="60" text-anchor="middle" class="svg-strong">pi</text>
  <rect x="170" y="30" width="150" height="50" rx="8" class="svg-hot"/>
  <text x="245" y="52" text-anchor="middle" class="svg-onhot">Gate 1</text>
  <text x="245" y="70" text-anchor="middle" class="svg-onhot-small">darf das raus?</text>
  <rect x="360" y="30" width="140" height="50" rx="8" class="svg-box"/>
  <text x="430" y="60" text-anchor="middle" class="svg-strong">Connector</text>
  <rect x="540" y="30" width="150" height="50" rx="8" class="svg-hot"/>
  <text x="615" y="52" text-anchor="middle" class="svg-onhot">Gate 2</text>
  <text x="615" y="70" text-anchor="middle" class="svg-onhot-small">darf das rein?</text>
  <path d="M130,55 L166,55" class="svg-line" marker-end="url(#ah2)"/>
  <path d="M320,55 L356,55" class="svg-line" marker-end="url(#ah2)"/>
  <path d="M500,55 L536,55" class="svg-line" marker-end="url(#ah2)"/>
  <path d="M690,55 C740,55 740,160 690,160 L60,160 L60,84" class="svg-line" marker-end="url(#ah2)"/>
  <text x="300" y="152" class="svg-small">Antwort mit Label und decision_id zurück an pi</text>
  <rect x="170" y="210" width="520" height="60" rx="8" class="svg-box"/>
  <text x="185" y="233" class="svg-strong">Journal (verkettet, nur anhängbar)</text>
  <text x="185" y="256" class="svg-small">① Beleg vor dem Aufruf    ② Beleg nach der Antwort</text>
  <path d="M245,80 L245,206" class="svg-line" marker-end="url(#ah2)"/>
  <path d="M615,80 L615,206" class="svg-line" marker-end="url(#ah2)"/>
  <text x="252" y="196" class="svg-small">①</text>
  <text x="622" y="196" class="svg-small">②</text>
  <path d="M232,80 C232,98 205,104 175,106" class="svg-deny"/>
  <text x="70" y="104" class="svg-denytext">nein: Ablehnung mit Hinweisen,</text>
  <text x="70" y="117" class="svg-denytext">Connector wird nie gerufen</text>
</svg>
